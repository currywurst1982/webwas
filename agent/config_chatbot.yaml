# ──────────────────────────────────────────────────────────────────────────────
# WildFly Agent Configuration — chatbot 인스턴스
# ──────────────────────────────────────────────────────────────────────────────

server:
  id: "chatbot-server-01"
  host: ""                           # 비어있으면 시스템 hostname 사용

wildfly:
  log_path: "/opt/wildfly-26/domains/chatbot/logs/stdlog/server.log"
  instance_name: "chatbot"           # chatbot 인스턴스명 직접 지정
  ajp_port: ""                       # 비어있으면 standalone.xml + port-offset으로 자동 감지
  standalone_xml: "/opt/wildfly-26/domains/chatbot/conf/standalone-chatbot.xml"

controller:
  url: "http://localhost:8380"
  api_key: ""

monitoring:
  poll_interval: 5
  report_interval: 30

anomaly:
  error_storm_threshold: 10
  error_storm_window: 60
  simulation_anomaly_rate: 0.08

jboss_cli:
  path: "/opt/wildfly-26/bin/jboss-cli.sh"
  host: "localhost"
  port: 9991                         # chatbot management 포트 (claude-test 9990 + 1)
  user: "admin"
  password: "admin123"
  timeout: 60
  enabled: true
