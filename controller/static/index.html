<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WildFly 26 Agent Monitor</title>
  <style>
    /* ── Reset & Variables ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface2:    #21262d;
      --border:      #30363d;
      --text:        #c9d1d9;
      --dim:         #8b949e;
      --bright:      #f0f6fc;
      --critical:    #f85149;
      --high:        #d29922;
      --medium:      #388bfd;
      --low:         #3fb950;
      --online:      #3fb950;
      --offline:     #6e7681;
      --accent:      #1f6feb;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { font-size: 20px; font-weight: 700; color: var(--bright); letter-spacing: -.5px; }
    .logo em { color: var(--accent); font-style: normal; }

    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 11px;
      color: var(--dim);
      margin-left: 10px;
    }

    .conn-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--dim);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--offline);
      flex-shrink: 0;
      transition: background .3s;
    }
    .dot.on { background: var(--online); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Main ───────────────────────────────────────────────────────────────── */
    main { max-width: 1600px; margin: 0 auto; padding: 24px; }

    /* ── Stats row ──────────────────────────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 8px;
    }

    .stat-val {
      font-size: 34px;
      font-weight: 700;
      color: var(--bright);
      line-height: 1;
    }

    .stat-card.s-online  .stat-val { color: var(--online); }
    .stat-card.s-crit    .stat-val { color: var(--critical); }
    .stat-card.s-warn    .stat-val { color: var(--high); }

    /* ── Section titles ─────────────────────────────────────────────────────── */
    .sec-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--bright);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sec-count {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 12px;
      color: var(--dim);
      font-weight: 500;
    }

    /* ── Server grid ────────────────────────────────────────────────────────── */
    .server-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .srv-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      transition: border-color .2s;
    }

    .srv-card.st-critical { border-color: var(--critical); }
    .srv-card.st-warning  { border-color: var(--high); }
    .srv-card.st-offline  { opacity: .55; }

    .srv-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .srv-id   { font-size: 15px; font-weight: 600; color: var(--bright); }
    .srv-host { font-size: 12px; color: var(--dim); margin-top: 2px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-pill::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }

    .status-pill.online   { background:rgba(63,185,80,.15);  color:var(--online); }
    .status-pill.offline  { background:rgba(110,118,129,.15);color:var(--offline); }
    .status-pill.critical { background:rgba(248,81,73,.15);  color:var(--critical); }
    .status-pill.warning  { background:rgba(210,153,34,.15); color:var(--high); }
    .status-pill.unknown  { background:rgba(110,118,129,.15);color:var(--dim); }

    .srv-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .meta-item label { display:block; font-size:11px; color:var(--dim); margin-bottom:2px; }
    .meta-item span  { font-size:13px; color:var(--text); }

    /* severity badges */
    .sev-badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }

    .sev-b {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .sev-b.CRITICAL { background:rgba(248,81,73,.2);  color:var(--critical); }
    .sev-b.HIGH     { background:rgba(210,153,34,.2); color:var(--high); }
    .sev-b.MEDIUM   { background:rgba(56,139,253,.2); color:var(--medium); }
    .sev-b.LOW      { background:rgba(63,185,80,.2);  color:var(--low); }

    .log-preview { border-top:1px solid var(--border); padding-top:12px; }
    .log-preview-lbl { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }

    .log-row {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--surface2);
      margin-bottom: 3px;
      display: flex;
      gap: 8px;
    }
    .log-row-sev { font-weight:700; min-width:52px; flex-shrink:0; }
    .log-row-sev.CRITICAL,.log-row-sev.FATAL { color:var(--critical); }
    .log-row-sev.HIGH    { color:var(--high); }
    .log-row-sev.MEDIUM  { color:var(--medium); }
    .log-row-sev.LOW     { color:var(--low); }
    .log-row-msg { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }

    /* ── Anomaly feed ────────────────────────────────────────────────────────── */
    .feed-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .feed-top {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feed-top-title { font-size:14px; font-weight:600; color:var(--bright); }

    .filter-row { display:flex; gap:6px; }

    .fbtn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 12px;
      font-size: 12px;
      color: var(--dim);
      cursor: pointer;
      transition: all .15s;
    }
    .fbtn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .fbtn:hover:not(.active) { border-color:var(--text); color:var(--text); }
    .fbtn.clear { color:var(--critical); }

    .feed-body { max-height: 480px; overflow-y: auto; }
    .feed-body::-webkit-scrollbar { width:4px; }
    .feed-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    .feed-row {
      display: grid;
      grid-template-columns: 80px 95px 140px 120px 1fr;
      gap: 10px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      font-size: 12px;
      animation: fadein .3s;
    }
    @keyframes fadein { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:none} }

    .feed-row:last-child { border-bottom:none; }
    .feed-row:hover { background:var(--surface2); }

    .feed-sev {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .feed-sev.CRITICAL { background:rgba(248,81,73,.2);  color:var(--critical); }
    .feed-sev.HIGH     { background:rgba(210,153,34,.2); color:var(--high); }
    .feed-sev.MEDIUM   { background:rgba(56,139,253,.2); color:var(--medium); }
    .feed-sev.LOW      { background:rgba(63,185,80,.2);  color:var(--low); }

    .feed-time   { color:var(--dim); }
    .feed-server { color:var(--accent); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .feed-rule   { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .feed-msg    { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .feed-empty { padding:48px; text-align:center; color:var(--dim); }
    .feed-empty-icon { font-size:28px; margin-bottom:8px; }

    /* ── Notifications ───────────────────────────────────────────────────────── */
    #notif-area {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .notif {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      max-width: 360px;
      display: flex;
      gap: 10px;
      animation: fadein .3s;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    .notif.CRITICAL { border-color:var(--critical); }
    .notif.HIGH     { border-color:var(--high); }

    .notif-icon { font-size:16px; flex-shrink:0; }
    .notif-title { font-size:13px; font-weight:600; color:var(--bright); margin-bottom:2px; }
    .notif-body  { font-size:12px; color:var(--dim); }

    /* ── Detail panel ────────────────────────────────────────────────────────── */
    .panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 200;
    }
    .panel-overlay.open { display:block; }

    .detail-panel {
      position: fixed;
      top: 0; right: 0;
      width: min(540px, 100vw);
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .25s ease;
      overflow: hidden;
    }
    .detail-panel.open { transform: translateX(0); }

    .panel-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .panel-head-left { display:flex; align-items:center; gap:10px; }
    .panel-title { font-size:16px; font-weight:700; color:var(--bright); }

    .panel-close {
      background: none;
      border: none;
      color: var(--dim);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      line-height: 1;
    }
    .panel-close:hover { background:var(--surface2); color:var(--bright); }

    .panel-body { padding: 20px; overflow-y: auto; flex: 1; }
    .panel-body::-webkit-scrollbar { width:4px; }
    .panel-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    .panel-section { margin-bottom: 22px; }
    .panel-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .panel-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .panel-meta-item label { display:block; font-size:11px; color:var(--dim); margin-bottom:3px; }
    .panel-meta-item span  { font-size:13px; color:var(--text); word-break:break-all; }

    .panel-desc {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      padding: 12px 14px;
      background: var(--surface2);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    .remedy-list { list-style: none; display:flex; flex-direction:column; gap:8px; }
    .remedy-list li {
      display: flex;
      gap: 10px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.55;
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: 6px;
    }
    .remedy-num {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .log-block {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 12px;
      color: var(--dim);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
    }

    .feed-row { cursor: pointer; }

    @media (max-width: 800px) {
      .feed-row { grid-template-columns: 70px 1fr 1fr; }
      .feed-row .feed-time, .feed-row .feed-server { display:none; }
      .detail-panel { width:100vw; }
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center">
    <div class="logo">Wild<em>Fly</em> Monitor</div>
    <span class="badge">WildFly 26 · Agent Controller</span>
  </div>
  <div class="conn-bar">
    <div class="dot" id="dot"></div>
    <span id="conn-lbl">연결 중...</span>
    <span id="upd-lbl" style="font-size:12px;margin-left:6px;"></span>
  </div>
</header>

<main>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">전체 서버</div>
      <div class="stat-val" id="s-total">0</div>
    </div>
    <div class="stat-card s-online">
      <div class="stat-label">정상</div>
      <div class="stat-val" id="s-online">0</div>
    </div>
    <div class="stat-card s-crit">
      <div class="stat-label">Critical</div>
      <div class="stat-val" id="s-crit">0</div>
    </div>
    <div class="stat-card s-warn">
      <div class="stat-label">Warning</div>
      <div class="stat-val" id="s-warn">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">오프라인</div>
      <div class="stat-val" id="s-offline">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">감지 이상 (누적)</div>
      <div class="stat-val" id="s-total-anom">0</div>
    </div>
  </div>

  <!-- Server grid -->
  <div class="sec-title">
    서버 현황
    <span class="sec-count" id="srv-count">0</span>
  </div>
  <div class="server-grid" id="server-grid">
    <div style="color:var(--dim);padding:32px;grid-column:1/-1;text-align:center;">
      Agent 연결 대기 중…
    </div>
  </div>

  <!-- Anomaly feed -->
  <div class="sec-title">
    실시간 이상 탐지 피드
    <span class="sec-count" id="feed-count">0</span>
  </div>
  <div class="feed-card">
    <div class="feed-top">
      <span class="feed-top-title">최근 이상 로그</span>
      <div class="filter-row">
        <button class="fbtn active" onclick="setFilter('ALL')">전체</button>
        <button class="fbtn" onclick="setFilter('CRITICAL')">Critical</button>
        <button class="fbtn" onclick="setFilter('HIGH')">High</button>
        <button class="fbtn" onclick="setFilter('MEDIUM')">Medium</button>
        <button class="fbtn clear" onclick="clearFeed()">초기화</button>
      </div>
    </div>
    <div class="feed-body" id="feed-body">
      <div class="feed-empty">
        <div class="feed-empty-icon">✅</div>
        <div>이상 탐지 없음 — 모든 시스템 정상</div>
      </div>
    </div>
  </div>

</main>

<div id="notif-area"></div>

<!-- Detail panel overlay -->
<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>

<!-- Detail panel -->
<div class="detail-panel" id="detail-panel">
  <div class="panel-head">
    <div class="panel-head-left">
      <span class="feed-sev" id="panel-sev"></span>
      <span class="panel-title" id="panel-rule"></span>
    </div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">

    <!-- 기본 정보 -->
    <div class="panel-section">
      <div class="panel-section-title">기본 정보</div>
      <div class="panel-meta-grid">
        <div class="panel-meta-item"><label>서버</label><span id="pi-server"></span></div>
        <div class="panel-meta-item"><label>호스트</label><span id="pi-host"></span></div>
        <div class="panel-meta-item"><label>감지 시각</label><span id="pi-time"></span></div>
        <div class="panel-meta-item"><label>로그 레벨</label><span id="pi-level"></span></div>
        <div class="panel-meta-item" style="grid-column:1/-1"><label>로거</label><span id="pi-logger"></span></div>
      </div>
    </div>

    <!-- 오류 설명 -->
    <div class="panel-section">
      <div class="panel-section-title">오류 내용</div>
      <div class="panel-desc" id="pi-desc"></div>
    </div>

    <!-- 조치 방법 -->
    <div class="panel-section">
      <div class="panel-section-title">조치 방법</div>
      <ol class="remedy-list" id="pi-remedy">
        <li><span class="remedy-num">!</span><span>조치 정보가 없습니다.</span></li>
      </ol>
    </div>

    <!-- 원본 로그 -->
    <div class="panel-section">
      <div class="panel-section-title">원본 로그 메시지</div>
      <div class="log-block" id="pi-log"></div>
    </div>

  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const S = {
  agents: {},
  anomalies: [],    // newest first
  totalAnom: 0,
  filter: 'ALL',
};

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws, retryTimer;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen  = () => { setConn(true);  clearTimeout(retryTimer); };
  ws.onclose = () => { setConn(false); retryTimer = setTimeout(connect, 3000); };
  ws.onerror = ()  => ws.close();
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch {} };

  setInterval(() => ws && ws.readyState === 1 && ws.send('ping'), 25000);
}

function setConn(ok) {
  document.getElementById('dot').className    = 'dot' + (ok ? ' on' : '');
  document.getElementById('conn-lbl').textContent = ok ? '연결됨' : '재연결 중…';
}

function handle(msg) {
  document.getElementById('upd-lbl').textContent =
    '갱신: ' + new Date().toLocaleTimeString('ko-KR');

  switch (msg.type) {
    case 'state':
      S.agents = msg.data.agents || {};
      (msg.data.recent_anomalies || []).forEach(a => {
        if (!S.anomalies.find(x => x.id === a.id)) {
          S.anomalies.unshift(a);
          S.totalAnom++;
        }
      });
      renderAll();
      break;

    case 'agent_registered':
      S.agents[msg.data.server_id] = msg.data.agent;
      renderServers();
      renderStats();
      notify('info', `Agent 등록: ${msg.data.server_id}`, msg.data.agent.host);
      break;

    case 'heartbeat': {
      const ag = S.agents[msg.data.server_id];
      if (ag) {
        ag.last_heartbeat = msg.data.timestamp;
        ag.stats  = msg.data.stats;
        ag.status = msg.data.status;
        refreshCard(msg.data.server_id);
        renderStats();
      }
      break;
    }

    case 'anomalies': {
      const items = msg.data.anomalies || [];
      items.forEach(a => {
        a.server_id = msg.data.server_id;
        a.host      = msg.data.host;
        S.anomalies.unshift(a);
        S.totalAnom++;
      });
      if (S.anomalies.length > 1000) S.anomalies.length = 1000;

      const ag = S.agents[msg.data.server_id];
      if (ag) {
        ag.status = msg.data.agent_status;
        ag.recent_anomalies = items.slice(0, 5);
        refreshCard(msg.data.server_id);
      }

      renderFeed();
      renderStats();

      items.filter(a => ['CRITICAL','HIGH'].includes(a.severity)).forEach(a => {
        const icon = a.severity === 'CRITICAL' ? '🚨' : '⚠️';
        notify(a.severity,
          `${icon} [${msg.data.server_id}] ${a.rule_name}`,
          (a.log_entry?.message || a.description || '').substring(0, 80));
      });
      break;
    }

    case 'agent_offline': {
      const ag = S.agents[msg.data.server_id];
      if (ag) { ag.status = 'offline'; refreshCard(msg.data.server_id); renderStats(); }
      break;
    }

    case 'ping':
      ws && ws.readyState === 1 && ws.send('ping');
      break;
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll() { renderServers(); renderFeed(); renderStats(); }

function renderStats() {
  const all = Object.values(S.agents);
  cnt('s-total',      all.length);
  cnt('s-online',     all.filter(a => a.status === 'online').length);
  cnt('s-crit',       all.filter(a => a.status === 'critical').length);
  cnt('s-warn',       all.filter(a => a.status === 'warning').length);
  cnt('s-offline',    all.filter(a => a.status === 'offline').length);
  cnt('s-total-anom', S.totalAnom);
}

function renderServers() {
  const grid = document.getElementById('server-grid');
  const ids  = Object.keys(S.agents);
  cnt('srv-count', ids.length);

  if (!ids.length) {
    grid.innerHTML = '<div style="color:var(--dim);padding:32px;grid-column:1/-1;text-align:center;">Agent 연결 대기 중…</div>';
    return;
  }

  ids.forEach(id => {
    let card = document.getElementById('card-' + id);
    if (!card) {
      card = document.createElement('div');
      card.id = 'card-' + id;
      grid.appendChild(card);
    }
    fillCard(card, id, S.agents[id]);
  });
}

function refreshCard(id) {
  const card = document.getElementById('card-' + id);
  if (card && S.agents[id]) fillCard(card, id, S.agents[id]);
}

function fillCard(el, id, a) {
  const st = a.status || 'unknown';
  el.className = `srv-card st-${st}`;

  const counts  = a.anomaly_counts || {};
  const badges  = ['CRITICAL','HIGH','MEDIUM','LOW']
    .filter(s => counts[s])
    .map(s => `<span class="sev-b ${s}">${s}: ${counts[s]}</span>`)
    .join('') || '<span style="color:var(--dim);font-size:12px;">이상 없음</span>';

  const recent = (a.recent_anomalies || []).slice(0, 4);
  const logRows = recent.length
    ? recent.map(r => {
        const sev = r.severity || '';
        const msg = esc((r.log_entry?.message || r.description || '').substring(0, 80));
        return `<div class="log-row">
          <span class="log-row-sev ${sev}">${sev}</span>
          <span class="log-row-msg" title="${esc(r.log_entry?.message||'')}">${msg}</span>
        </div>`;
      }).join('')
    : '<div style="color:var(--dim);font-size:12px;">최근 이상 없음</div>';

  const hb    = a.last_heartbeat ? new Date(a.last_heartbeat).toLocaleTimeString('ko-KR') : 'N/A';
  const stats = a.stats || {};
  const simBadge = a.simulate ? ' <em style="color:var(--dim);font-weight:400;font-size:11px;">[시뮬레이션]</em>' : '';

  el.innerHTML = `
    <div class="srv-head">
      <div>
        <div class="srv-id">${esc(id)}${simBadge}</div>
        <div class="srv-host">${esc(a.host || '')}</div>
      </div>
      <div class="status-pill ${st}">${stLabel(st)}</div>
    </div>
    <div class="srv-meta">
      <div class="meta-item"><label>마지막 Heartbeat</label><span>${hb}</span></div>
      <div class="meta-item"><label>WildFly 버전</label><span>${esc(a.wildfly_version || '26')}</span></div>
      <div class="meta-item"><label>처리 로그 수</label><span>${stats.entries_processed ?? '—'}</span></div>
      <div class="meta-item"><label>감지 이상 수</label><span>${stats.anomalies_detected ?? '—'}</span></div>
    </div>
    <div class="sev-badges">${badges}</div>
    <div class="log-preview">
      <div class="log-preview-lbl">최근 이상 로그</div>
      ${logRows}
    </div>`;
}

function renderFeed() {
  const body = document.getElementById('feed-body');
  const list = S.filter === 'ALL'
    ? S.anomalies
    : S.anomalies.filter(a => a.severity === S.filter);

  cnt('feed-count', S.totalAnom);

  if (!list.length) {
    body.innerHTML = `<div class="feed-empty">
      <div class="feed-empty-icon">✅</div>
      <div>이상 탐지 없음 — 모든 시스템 정상</div>
    </div>`;
    return;
  }

  const rows = list.slice(0, 300).map((a, i) => {
    const t   = a.detected_at ? new Date(a.detected_at).toLocaleTimeString('ko-KR') : '';
    const msg = (a.log_entry?.message || a.description || '').substring(0, 120);
    return `<div class="feed-row" onclick="openPanel(${i})" title="클릭하여 상세 정보 보기">
      <span class="feed-sev ${a.severity}">${a.severity}</span>
      <span class="feed-time">${esc(t)}</span>
      <span class="feed-server">${esc(a.server_id || '')}</span>
      <span class="feed-rule">${esc(a.rule_name || '')}</span>
      <span class="feed-msg">${esc(msg)}</span>
    </div>`;
  }).join('');
  body.innerHTML = rows;
}

// ── Filter & controls ─────────────────────────────────────────────────────────
function setFilter(f) {
  S.filter = f;
  document.querySelectorAll('.fbtn').forEach(b => {
    b.classList.toggle('active',
      b.textContent === f || (f === 'ALL' && b.textContent === '전체'));
  });
  renderFeed();
}

function clearFeed() {
  S.anomalies = [];
  S.totalAnom = 0;
  renderFeed();
  renderStats();
}

// ── Notifications ─────────────────────────────────────────────────────────────
function notify(severity, title, body) {
  const area = document.getElementById('notif-area');
  const el   = document.createElement('div');
  el.className = 'notif ' + severity;
  el.innerHTML = `
    <div class="notif-icon">${severity === 'CRITICAL' ? '🚨' : severity === 'HIGH' ? '⚠️' : 'ℹ️'}</div>
    <div>
      <div class="notif-title">${esc(title)}</div>
      ${body ? `<div class="notif-body">${esc(body)}</div>` : ''}
    </div>`;
  area.prepend(el);
  setTimeout(() => el.remove(), 7000);
  while (area.children.length > 5) area.lastChild?.remove();
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function cnt(id, v) {
  const el = document.getElementById(id);
  if (el) el.textContent = v;
}

function stLabel(s) {
  return { online:'정상', offline:'오프라인', critical:'Critical', warning:'Warning', unknown:'알 수 없음' }[s] || s;
}

// ── Detail panel ─────────────────────────────────────────────────────────────
function openPanel(idx) {
  const list = S.filter === 'ALL'
    ? S.anomalies
    : S.anomalies.filter(a => a.severity === S.filter);
  const a = list[idx];
  if (!a) return;

  // 기본 정보
  const sevEl = document.getElementById('panel-sev');
  sevEl.textContent  = a.severity || '';
  sevEl.className    = 'feed-sev ' + (a.severity || '');

  document.getElementById('panel-rule').textContent = a.rule_name || '알 수 없음';
  document.getElementById('pi-server').textContent  = a.server_id || '—';
  document.getElementById('pi-host').textContent    = a.host || '—';
  document.getElementById('pi-level').textContent   = a.log_entry?.level || '—';
  document.getElementById('pi-logger').textContent  = a.log_entry?.logger || '—';

  const dt = a.detected_at ? new Date(a.detected_at).toLocaleString('ko-KR') : '—';
  document.getElementById('pi-time').textContent = dt;

  // 오류 설명
  document.getElementById('pi-desc').textContent = a.description || '설명 없음';

  // 조치 방법
  const remedyEl = document.getElementById('pi-remedy');
  const remedies = a.remedy || [];
  if (remedies.length) {
    remedyEl.innerHTML = remedies.map((r, i) =>
      `<li><span class="remedy-num">${i + 1}</span><span>${esc(r)}</span></li>`
    ).join('');
  } else {
    remedyEl.innerHTML = '<li><span class="remedy-num">!</span><span>조치 정보가 없습니다. 개발팀에 로그를 공유하세요.</span></li>';
  }

  // 원본 로그
  document.getElementById('pi-log').textContent = a.log_entry?.message || '(로그 메시지 없음)';

  // 패널 열기
  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
  document.body.style.overflow = '';
}

// ESC 키로 패널 닫기
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// ── Boot ──────────────────────────────────────────────────────────────────────
connect();
</script>
</body>
</html>
