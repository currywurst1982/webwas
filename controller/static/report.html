<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WEB/WAS 운영 보고서</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface2:  #21262d;
    --border:    #30363d;
    --text:      #c9d1d9;
    --dim:       #8b949e;
    --bright:    #f0f6fc;
    --critical:  #f85149;
    --high:      #d29922;
    --medium:    #388bfd;
    --low:       #3fb950;
    --accent:    #1f6feb;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--bright); letter-spacing: -.5px; }
  .logo em { color: var(--accent); font-style: normal; }
  .nav-link {
    color: var(--dim); text-decoration: none; font-size: 13px;
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
  }
  .nav-link:hover { color: var(--bright); border-color: var(--accent); }

  main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 60px; }

  .week-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 20px;
  }
  .week-bar label { color: var(--dim); font-size: 12px; }
  select, input, textarea {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }

  button {
    cursor: pointer; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); border-radius: 6px; padding: 6px 12px; font-size: 13px;
    font-family: inherit; transition: background .15s, border-color .15s;
  }
  button:hover { border-color: var(--accent); color: var(--bright); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #388bfd; }
  button.danger { color: var(--critical); }
  button.danger:hover { border-color: var(--critical); }
  button.small { padding: 3px 9px; font-size: 12px; }

  section.card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 18px 20px; margin-bottom: 20px;
  }
  section.card h2 {
    font-size: 15px; color: var(--bright); display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 14px;
  }
  section.card h2 .title { display: flex; align-items: center; gap: 8px; }
  section.card h2 .hint { color: var(--dim); font-size: 12px; font-weight: 400; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    border: 1px solid var(--border); padding: 8px 10px; text-align: center;
    vertical-align: middle;
  }
  th { background: var(--surface2); color: var(--dim); font-weight: 600; white-space: nowrap; }
  td.left { text-align: left; }
  td.content { text-align: left; white-space: pre-wrap; max-width: 420px; line-height: 1.5; }
  tr.total-row td { background: var(--surface2); font-weight: 700; color: var(--bright); }
  tr:hover td { background: rgba(56,139,253,.06); }
  .empty-row td { color: var(--dim); padding: 20px; }
  .actions { display: flex; gap: 6px; justify-content: center; white-space: nowrap; }
  .diff-pos { color: var(--low); }
  .diff-neg { color: var(--critical); }
  .diff-zero { color: var(--dim); }

  /* Modal */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    width: 560px; max-width: 92vw; max-height: 88vh; overflow-y: auto; padding: 20px 22px;
  }
  .modal h3 { color: var(--bright); margin-bottom: 16px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; }
  .field textarea { min-height: 70px; resize: vertical; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .banner {
    padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px;
  }
  .banner.error { background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3); color: var(--critical); }
  .banner.ok { background: rgba(63,185,80,.1); border: 1px solid rgba(63,185,80,.3); color: var(--low); }
</style>
</head>
<body>
<header>
  <div class="logo">WEB/WAS 운영 <em>보고서</em></div>
  <a class="nav-link" href="/">← 모니터링 대시보드</a>
</header>

<main>
  <div id="toast"></div>

  <div class="week-bar">
    <label for="week-select">조회 주차</label>
    <select id="week-select" onchange="onWeekChange()"></select>
    <button onclick="openWeekModal('create')">+ 새 주차 추가</button>
    <button onclick="openWeekModal('edit')">주차 기간 수정</button>
    <button class="danger" onclick="deleteCurrentWeek()">주차 삭제</button>
  </div>

  <div id="content"></div>
</main>

<!-- Generic modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button onclick="closeModal()">취소</button>
      <button class="primary" onclick="submitModal()">저장</button>
    </div>
  </div>
</div>

<script>
let weeks = [];
let currentWeekId = null;
let bundle = null;
let modalCtx = null; // {kind, mode, id}

const API = "/api/report";

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.innerHTML = '<div class="banner ' + (type||'ok') + '">' + esc(msg) + '</div>';
  setTimeout(() => { el.innerHTML = ''; }, 4000);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function api(method, path, body) {
  const r = await fetch(API + path, {
    method, headers: {'Content-Type': 'application/json'},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    let detail = 'HTTP ' + r.status;
    try { const j = await r.json(); detail = j.detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  if (r.status === 204) return null;
  return r.json();
}

function fmtWeekLabel(w) {
  let s = w.start_date + ' ~ ' + w.end_date;
  if (w.next_start_date && w.next_end_date) s += '  (차주 ' + w.next_start_date + ' ~ ' + w.next_end_date + ')';
  return s;
}

async function loadWeeks(selectId) {
  weeks = await api('GET', '/weeks');
  const sel = document.getElementById('week-select');
  sel.innerHTML = weeks.map(w => '<option value="' + w.id + '">' + esc(fmtWeekLabel(w)) + '</option>').join('');
  if (!weeks.length) {
    currentWeekId = null;
    document.getElementById('content').innerHTML =
      '<div class="banner error">등록된 주간 보고서가 없습니다. "+ 새 주차 추가"로 시작하세요.</div>';
    return;
  }
  const target = selectId && weeks.some(w => w.id === selectId) ? selectId : weeks[0].id;
  sel.value = target;
  currentWeekId = target;
  await loadBundle(currentWeekId);
}

function onWeekChange() {
  currentWeekId = parseInt(document.getElementById('week-select').value, 10);
  loadBundle(currentWeekId);
}

async function loadBundle(weekId) {
  bundle = await api('GET', '/weeks/' + weekId);
  renderAll();
}

function renderAll() {
  const c = document.getElementById('content');
  c.innerHTML =
    renderOperationStatus() +
    renderWorkLog('current', '금주 진행 내역', bundle.week.start_date, bundle.week.end_date) +
    renderWorkLog('next', '차주 진행 내역', bundle.week.next_start_date, bundle.week.next_end_date) +
    renderSpecialNotes();
}

// ── 운영 현황 ─────────────────────────────────────────────────────────────────
function renderOperationStatus() {
  const rows = bundle.operation_status;
  const totals = {last_web:0,last_was:0,last_dev:0,this_web:0,this_was:0,this_dev:0};
  const body = rows.map(r => {
    Object.keys(totals).forEach(k => totals[k] += r[k]);
    const lastTotal = r.last_web + r.last_was + r.last_dev;
    const thisTotal  = r.this_web + r.this_was + r.this_dev;
    const diff = (a,b) => {
      const d = a - b;
      const cls = d > 0 ? 'diff-pos' : d < 0 ? 'diff-neg' : 'diff-zero';
      return '<span class="' + cls + '">' + (d > 0 ? '+' : '') + d + '</span>';
    };
    return '<tr>' +
      '<td class="left">' + esc(r.client_name) + '</td>' +
      '<td>' + r.last_web + '</td><td>' + r.last_was + '</td><td>' + r.last_dev + '</td><td>' + lastTotal + '</td>' +
      '<td>' + r.this_web + '</td><td>' + r.this_was + '</td><td>' + r.this_dev + '</td><td>' + thisTotal + '</td>' +
      '<td>' + diff(r.this_web, r.last_web) + '</td><td>' + diff(r.this_was, r.last_was) + '</td>' +
      '<td>' + diff(r.this_dev, r.last_dev) + '</td><td>' + diff(thisTotal, lastTotal) + '</td>' +
      '<td class="actions">' +
        '<button class="small" onclick="openOpModal(\'edit\',' + r.id + ')">수정</button>' +
        '<button class="small danger" onclick="deleteRow(\'op\',' + r.id + ')">삭제</button>' +
      '</td></tr>';
  }).join('') || '<tr class="empty-row"><td colspan="13">등록된 고객사가 없습니다.</td></tr>';

  const lastGrand = totals.last_web + totals.last_was + totals.last_dev;
  const thisGrand = totals.this_web + totals.this_was + totals.this_dev;

  return '<section class="card"><h2><span class="title">📊 운영 현황</span>' +
    '<button class="small" onclick="openOpModal(\'create\')">+ 고객사 추가</button></h2>' +
    '<table><thead><tr>' +
      '<th rowspan="2">분류</th><th colspan="4">전주 운영 현황</th><th colspan="4">금주 운영 현황</th>' +
      '<th colspan="4">변동사항</th><th rowspan="2">관리</th>' +
    '</tr><tr>' +
      '<th>WEB</th><th>WAS</th><th>개발</th><th>Total</th>' +
      '<th>WEB</th><th>WAS</th><th>개발</th><th>Total</th>' +
      '<th>WEB</th><th>WAS</th><th>개발</th><th>Total</th>' +
    '</tr></thead><tbody>' + body +
    '<tr class="total-row"><td class="left">총계</td>' +
      '<td>' + totals.last_web + '</td><td>' + totals.last_was + '</td><td>' + totals.last_dev + '</td><td>' + lastGrand + '</td>' +
      '<td>' + totals.this_web + '</td><td>' + totals.this_was + '</td><td>' + totals.this_dev + '</td><td>' + thisGrand + '</td>' +
      '<td colspan="5"></td></tr>' +
    '</tbody></table></section>';
}

// ── 진행 내역 (금주 / 차주 공용) ───────────────────────────────────────────────
function renderWorkLog(section, title, startDate, endDate) {
  const rows = bundle['work_log_' + section];
  let webSum = 0, wasSum = 0, etcSum = 0;
  const body = rows.map((r, i) => {
    webSum += r.web_count; wasSum += r.was_count; etcSum += r.etc_count;
    return '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td class="left">' + esc(r.category) + '</td>' +
      '<td>' + esc(r.request_date) + '</td>' +
      '<td>' + esc(r.requester) + '</td>' +
      '<td>' + esc(r.work_date) + '</td>' +
      '<td class="content">' + esc(r.work_content) + '</td>' +
      '<td>' + r.web_count + '</td><td>' + r.was_count + '</td><td>' + r.etc_count + '</td>' +
      '<td class="actions">' +
        '<button class="small" onclick="openWorkLogModal(\'edit\',\'' + section + '\',' + r.id + ')">수정</button>' +
        '<button class="small danger" onclick="deleteRow(\'worklog\',' + r.id + ')">삭제</button>' +
      '</td></tr>';
  }).join('') || '<tr class="empty-row"><td colspan="10">등록된 작업 이력이 없습니다.</td></tr>';

  const rangeLabel = (startDate && endDate) ? ' (' + startDate + ' ~ ' + endDate + ')' : '';

  return '<section class="card"><h2><span class="title">📋 ' + esc(title) + esc(rangeLabel) +
    '<span class="hint">전체 작업 수량 — WEB ' + webSum + ' / WAS ' + wasSum + ' / 기타 ' + etcSum + '</span></span>' +
    '<button class="small" onclick="openWorkLogModal(\'create\',\'' + section + '\')">+ 작업 추가</button></h2>' +
    '<table><thead><tr>' +
      '<th>번호</th><th>분류</th><th>요청 일자</th><th>요청자</th><th>작업 일자</th>' +
      '<th>작업 내용</th><th>WEB</th><th>WAS</th><th>기타</th><th>관리</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></section>';
}

// ── 특이 사항 ─────────────────────────────────────────────────────────────────
function renderSpecialNotes() {
  const rows = bundle.special_notes;
  const body = rows.map((r, i) => {
    return '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td class="left">' + esc(r.category) + '</td>' +
      '<td>' + esc(r.note_date) + '</td>' +
      '<td class="left">' + esc(r.title) + '</td>' +
      '<td class="left">' + esc(r.service_name) + '</td>' +
      '<td class="content">' + esc(r.detail) + '</td>' +
      '<td class="actions">' +
        '<button class="small" onclick="openNoteModal(\'edit\',' + r.id + ')">수정</button>' +
        '<button class="small danger" onclick="deleteRow(\'note\',' + r.id + ')">삭제</button>' +
      '</td></tr>';
  }).join('') || '<tr class="empty-row"><td colspan="7">등록된 특이 사항이 없습니다.</td></tr>';

  return '<section class="card"><h2><span class="title">⚠️ 특이 사항</span>' +
    '<button class="small" onclick="openNoteModal(\'create\')">+ 특이사항 추가</button></h2>' +
    '<table><thead><tr>' +
      '<th>번호</th><th>분류</th><th>일자</th><th>내용</th><th>서비스</th><th>상세 내용</th><th>관리</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></section>';
}

// ── Delete ───────────────────────────────────────────────────────────────────
async function deleteRow(kind, id) {
  if (!confirm('이 항목을 삭제하시겠습니까?')) return;
  const path = kind === 'op' ? '/operation-status/' + id
             : kind === 'worklog' ? '/work-logs/' + id
             : '/special-notes/' + id;
  try {
    await api('DELETE', path);
    toast('삭제되었습니다.');
    await loadBundle(currentWeekId);
  } catch (e) {
    toast('삭제 실패: ' + e.message, 'error');
  }
}

async function deleteCurrentWeek() {
  if (!currentWeekId) return;
  if (!confirm('이 주차의 보고서 전체(운영현황/진행내역/특이사항 포함)를 삭제하시겠습니까?')) return;
  try {
    await api('DELETE', '/weeks/' + currentWeekId);
    toast('주차가 삭제되었습니다.');
    await loadWeeks();
  } catch (e) {
    toast('삭제 실패: ' + e.message, 'error');
  }
}

// ── Modal: generic open/close ────────────────────────────────────────────────
function openModal(title) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-backdrop').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
  modalCtx = null;
}

// ── Modal: report_week ───────────────────────────────────────────────────────
function openWeekModal(mode) {
  const w = mode === 'edit' ? weeks.find(x => x.id === currentWeekId) : null;
  if (mode === 'edit' && !w) { toast('먼저 주차를 선택하세요.', 'error'); return; }
  modalCtx = {kind: 'week', mode};
  openModal(mode === 'edit' ? '주차 기간 수정' : '새 주차 추가');
  document.getElementById('modal-body').innerHTML =
    '<div class="field-row"><div class="field"><label>금주 시작일</label>' +
      '<input type="date" id="f-start" value="' + esc(w?.start_date||'') + '"></div>' +
    '<div class="field"><label>금주 종료일</label>' +
      '<input type="date" id="f-end" value="' + esc(w?.end_date||'') + '"></div></div>' +
    '<div class="field-row"><div class="field"><label>차주 시작일 (선택)</label>' +
      '<input type="date" id="f-nstart" value="' + esc(w?.next_start_date||'') + '"></div>' +
    '<div class="field"><label>차주 종료일 (선택)</label>' +
      '<input type="date" id="f-nend" value="' + esc(w?.next_end_date||'') + '"></div></div>';
}

// ── Modal: operation_status ──────────────────────────────────────────────────
function openOpModal(mode, id) {
  const r = mode === 'edit' ? bundle.operation_status.find(x => x.id === id) : null;
  modalCtx = {kind: 'op', mode, id};
  openModal(mode === 'edit' ? '고객사 운영 현황 수정' : '고객사 운영 현황 추가');
  document.getElementById('modal-body').innerHTML =
    '<div class="field"><label>고객사명</label><input id="f-client" value="' + esc(r?.client_name||'') + '"></div>' +
    '<div class="field-row">' +
      '<div class="field"><label>전주 WEB</label><input type="number" id="f-lweb" value="' + (r?.last_web??0) + '"></div>' +
      '<div class="field"><label>전주 WAS</label><input type="number" id="f-lwas" value="' + (r?.last_was??0) + '"></div>' +
      '<div class="field"><label>전주 개발</label><input type="number" id="f-ldev" value="' + (r?.last_dev??0) + '"></div>' +
    '</div>' +
    '<div class="field-row">' +
      '<div class="field"><label>금주 WEB</label><input type="number" id="f-tweb" value="' + (r?.this_web??0) + '"></div>' +
      '<div class="field"><label>금주 WAS</label><input type="number" id="f-twas" value="' + (r?.this_was??0) + '"></div>' +
      '<div class="field"><label>금주 개발</label><input type="number" id="f-tdev" value="' + (r?.this_dev??0) + '"></div>' +
    '</div>';
}

// ── Modal: work_log ──────────────────────────────────────────────────────────
function openWorkLogModal(mode, section, id) {
  const r = mode === 'edit' ? bundle['work_log_' + section].find(x => x.id === id) : null;
  modalCtx = {kind: 'worklog', mode, id, section};
  openModal((mode === 'edit' ? '작업 이력 수정' : '작업 이력 추가') + ' — ' + (section === 'current' ? '금주' : '차주'));
  document.getElementById('modal-body').innerHTML =
    '<div class="field"><label>분류</label><input id="f-category" value="' + esc(r?.category||'') + '"></div>' +
    '<div class="field-row">' +
      '<div class="field"><label>요청 일자</label><input id="f-reqdate" placeholder="예: 06월 29일" value="' + esc(r?.request_date||'') + '"></div>' +
      '<div class="field"><label>요청자</label><input id="f-requester" value="' + esc(r?.requester||'') + '"></div>' +
    '</div>' +
    '<div class="field"><label>작업 일자</label><input id="f-workdate" placeholder="예: 06월 29일~07월 03일" value="' + esc(r?.work_date||'') + '"></div>' +
    '<div class="field"><label>작업 내용</label><textarea id="f-content">' + esc(r?.work_content||'') + '</textarea></div>' +
    '<div class="field-row">' +
      '<div class="field"><label>WEB</label><input type="number" id="f-web" value="' + (r?.web_count??0) + '"></div>' +
      '<div class="field"><label>WAS</label><input type="number" id="f-was" value="' + (r?.was_count??0) + '"></div>' +
      '<div class="field"><label>기타</label><input type="number" id="f-etc" value="' + (r?.etc_count??0) + '"></div>' +
    '</div>';
}

// ── Modal: special_note ──────────────────────────────────────────────────────
function openNoteModal(mode, id) {
  const r = mode === 'edit' ? bundle.special_notes.find(x => x.id === id) : null;
  modalCtx = {kind: 'note', mode, id};
  openModal(mode === 'edit' ? '특이 사항 수정' : '특이 사항 추가');
  document.getElementById('modal-body').innerHTML =
    '<div class="field-row">' +
      '<div class="field"><label>분류</label><input id="f-category" value="' + esc(r?.category||'') + '"></div>' +
      '<div class="field"><label>일자</label><input id="f-notedate" placeholder="예: 07월 01일" value="' + esc(r?.note_date||'') + '"></div>' +
    '</div>' +
    '<div class="field-row">' +
      '<div class="field"><label>내용(제목)</label><input id="f-title" value="' + esc(r?.title||'') + '"></div>' +
      '<div class="field"><label>서비스</label><input id="f-service" value="' + esc(r?.service_name||'') + '"></div>' +
    '</div>' +
    '<div class="field"><label>상세 내용</label><textarea id="f-detail">' + esc(r?.detail||'') + '</textarea></div>';
}

// ── Modal: submit dispatcher ─────────────────────────────────────────────────
async function submitModal() {
  if (!modalCtx) return;
  try {
    if (modalCtx.kind === 'week') {
      const body = {
        start_date: document.getElementById('f-start').value,
        end_date: document.getElementById('f-end').value,
        next_start_date: document.getElementById('f-nstart').value || null,
        next_end_date: document.getElementById('f-nend').value || null,
      };
      if (!body.start_date || !body.end_date) { toast('금주 시작일/종료일을 입력하세요.', 'error'); return; }
      const saved = modalCtx.mode === 'edit'
        ? await api('PUT', '/weeks/' + currentWeekId, body)
        : await api('POST', '/weeks', body);
      closeModal();
      toast('저장되었습니다.');
      await loadWeeks(saved.id);

    } else if (modalCtx.kind === 'op') {
      const body = {
        client_name: document.getElementById('f-client').value,
        sort_order: 0,
        last_web: +document.getElementById('f-lweb').value || 0,
        last_was: +document.getElementById('f-lwas').value || 0,
        last_dev: +document.getElementById('f-ldev').value || 0,
        this_web: +document.getElementById('f-tweb').value || 0,
        this_was: +document.getElementById('f-twas').value || 0,
        this_dev: +document.getElementById('f-tdev').value || 0,
      };
      if (!body.client_name.trim()) { toast('고객사명을 입력하세요.', 'error'); return; }
      if (modalCtx.mode === 'edit') await api('PUT', '/operation-status/' + modalCtx.id, body);
      else await api('POST', '/weeks/' + currentWeekId + '/operation-status', body);
      closeModal();
      toast('저장되었습니다.');
      await loadBundle(currentWeekId);

    } else if (modalCtx.kind === 'worklog') {
      const body = {
        section: modalCtx.section,
        sort_order: 0,
        category: document.getElementById('f-category').value,
        request_date: document.getElementById('f-reqdate').value,
        requester: document.getElementById('f-requester').value,
        work_date: document.getElementById('f-workdate').value,
        work_content: document.getElementById('f-content').value,
        web_count: +document.getElementById('f-web').value || 0,
        was_count: +document.getElementById('f-was').value || 0,
        etc_count: +document.getElementById('f-etc').value || 0,
      };
      if (modalCtx.mode === 'edit') await api('PUT', '/work-logs/' + modalCtx.id, body);
      else await api('POST', '/weeks/' + currentWeekId + '/work-logs', body);
      closeModal();
      toast('저장되었습니다.');
      await loadBundle(currentWeekId);

    } else if (modalCtx.kind === 'note') {
      const body = {
        sort_order: 0,
        category: document.getElementById('f-category').value,
        note_date: document.getElementById('f-notedate').value,
        title: document.getElementById('f-title').value,
        service_name: document.getElementById('f-service').value,
        detail: document.getElementById('f-detail').value,
      };
      if (modalCtx.mode === 'edit') await api('PUT', '/special-notes/' + modalCtx.id, body);
      else await api('POST', '/weeks/' + currentWeekId + '/special-notes', body);
      closeModal();
      toast('저장되었습니다.');
      await loadBundle(currentWeekId);
    }
  } catch (e) {
    toast('저장 실패: ' + e.message, 'error');
  }
}

loadWeeks();
</script>
</body>
</html>
