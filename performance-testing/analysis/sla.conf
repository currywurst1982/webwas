# ============================================================
# SLA (Service Level Agreement) 기준값 설정 파일
# generate-report.sh에서 source로 로드
#
# 운영 환경 SLA 예시 (프로젝트에 맞게 수정):
#   - 일반 조회 API: p95 < 300ms
#   - 복합 트랜잭션: p95 < 1000ms
#   - 에러율: 0.1% 미만
# ============================================================

SLA_DESCRIPTION="WildFly 26 운영 SLA 기준"

# 응답시간 기준 (ms)
SLA_P95=500        # p95: 95%의 사용자가 이 시간 이내 응답 받아야 함
SLA_P99=2000       # p99: 99%의 사용자 기준

# 에러율 기준 (%)
SLA_ERROR_RATE=0.1  # HTTP 5xx 및 Timeout 포함

# 처리량 기준 (초당 요청 수)
SLA_TPS=200        # 목표 TPS (Transactions Per Second)

# 자원 사용 기준 (post-test-analysis.sh 참조)
SLA_CPU_MAX=80          # CPU 사용률 최대 (%)
SLA_HEAP_AFTER_GC=70    # GC 후 Heap 점유율 최대 (%)
SLA_GC_OVERHEAD=5       # GC 오버헤드 최대 (%)
SLA_DS_WAIT_COUNT=0     # Datasource wait_count 허용값 (0이면 무관용)
