gatling {
  core {
    # 결과 인코딩
    encoding = "utf-8"

    # 시뮬레이션 결과 경로
    directory {
      results = "results"
      binaries = ""
      reportsOnly = ""
    }

    # 시뮬레이션 제한 (무응답 시 강제 종료 방지)
    shutdownTimeout = 30
  }

  charting {
    # 응답시간 그래프에 표시할 최대값 (ms)
    maxPlotPerSeries = 1000

    indicators {
      # 응답시간 버킷 기준 (ms): 그린/옐로/오렌지/레드 구간
      lowerBound  = 200
      higherBound = 1000
      percentile1 = 50   # p50
      percentile2 = 75   # p75
      percentile3 = 95   # p95
      percentile4 = 99   # p99
    }
  }

  http {
    # HTTP 연결 설정
    fetchedCssFailed = false

    ssl {
      # mTLS 또는 자체 서명 인증서 사용 시 검증 비활성화 (운영에서는 활성화 필수)
      trustManager {
        type = InsecureTrustManagerFactory
      }
    }
  }

  data {
    # 데이터 라이터: 콘솔 + 로그파일
    writers = [console, file]

    console {
      # 콘솔 출력 주기 (초)
      writePeriod = 5
    }

    file {
      # simulation.log 파일 버퍼 크기
      bufferSize = 8192
    }
  }
}
