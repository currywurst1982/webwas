networks:
  perf-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  influxdb-data:

services:

  # ── Prometheus: 메트릭 수집 엔진 ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: perf-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules/:/etc/prometheus/rules/:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    networks:
      - perf-net

  # ── Grafana: 시각화 대시보드 ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: perf-grafana
    restart: unless-stopped
    ports:
      - "5000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wildfly-overview.json
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - perf-net
    depends_on:
      - prometheus
      - influxdb

  # ── Grafana 홈 대시보드 초기화 (재시작 후 org 설정 복원) ────────────────
  grafana-init:
    image: curlimages/curl:8.7.1
    container_name: perf-grafana-init
    depends_on:
      grafana:
        condition: service_healthy
    command: >
      sh -c "curl -sf -u admin:admin123
      -X PUT http://grafana:3000/api/org/preferences
      -H 'Content-Type: application/json'
      -d '{\"homeDashboardUID\":\"wildfly-perf-overview\"}'
      && echo 'Home dashboard set'"
    networks:
      - perf-net
    restart: "no"

  # ── InfluxDB: Gatling 실시간 결과 저장소 ──────────────────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: perf-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
      - "2003:2003"
    environment:
      INFLUXDB_DB: gatling
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      INFLUXDB_DATA_ENGINE: tsm1
      INFLUXDB_REPORTING_DISABLED: "true"
      INFLUXDB_GRAPHITE_ENABLED: "true"
      INFLUXDB_GRAPHITE_BIND_ADDRESS: ":2003"
      INFLUXDB_GRAPHITE_DATABASE: gatling
      INFLUXDB_GRAPHITE_PROTOCOL: tcp
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - perf-net

  # ── Node Exporter: OS 메트릭 수집 ────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: perf-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - perf-net

  # ── 리포트 서버: Gatling HTML 보고서 뷰어 ────────────────────────────────
  report-server:
    image: nginx:alpine
    container_name: perf-report-server
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../results:/usr/share/nginx/html/results:ro
    networks:
      - perf-net
