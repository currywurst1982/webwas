# ============================================================
# Gatling → InfluxDB 실시간 메트릭 전송 설정
# 위치: $GATLING_HOME/conf/gatling.conf 에 병합하거나
#       이 파일을 gatling.conf 로 대체
#
# Grafana에서 실시간으로 TPS / 응답시간 / 에러율 확인 가능
# ============================================================

gatling {
  core {
    encoding = "utf-8"
    shutdownTimeout = 30

    directory {
      results = "results"
    }

    charting {
      indicators {
        lowerBound  = 200
        higherBound = 1000
        percentile1 = 50
        percentile2 = 75
        percentile3 = 95
        percentile4 = 99
      }
    }
  }

  data {
    # 콘솔 + 파일 + InfluxDB 동시 활성화
    writers = [console, file, graphite]

    console {
      writePeriod = 5
    }

    file {
      bufferSize = 8192
    }

    # ── Graphite/InfluxDB 전송 설정 ────────────────────────────────────────
    # InfluxDB 1.x는 Graphite 프로토콜을 지원 (별도 설정 필요)
    # influxdb.conf에서 [[graphite]] 섹션 활성화:
    #   [[graphite]]
    #     enabled = true
    #     bind-address = ":2003"
    #     protocol = "tcp"
    #     database = "gatling"
    graphite {
      # InfluxDB Graphite 수신 포트 (기본 2003)
      host   = "localhost"     # docker compose 사용 시: influxdb 컨테이너 IP
      port   = 2003
      protocol = "tcp"

      # 전송 주기 (초) - 낮을수록 실시간성 높아지나 부하 증가
      writePeriod = 1

      # Gatling 메트릭 prefix
      # Grafana 쿼리: gatling.*.allRequests.ok.count 등
      rootPathPrefix = "gatling"
    }
  }

  http {
    ssl {
      trustManager {
        type = InsecureTrustManagerFactory
      }
    }
  }
}

# ── InfluxDB Graphite 프로토콜 활성화 방법 ─────────────────────────────────
# 1. docker compose의 influxdb 서비스에 포트 추가:
#      ports:
#        - "8086:8086"
#        - "2003:2003"   ← Graphite 수신 포트 추가
#
# 2. InfluxDB 컨테이너 내부에서 설정 확인:
#    docker exec -it perf-influxdb influx
#    > SHOW DATABASES
#    > USE gatling
#    > SHOW MEASUREMENTS    ← Gatling 실행 후 측정값 확인
#
# 3. Grafana에서 쿼리 예시:
#    SELECT non_negative_derivative(mean("value"), 1s) as "TPS"
#    FROM "gatling.scenario.allRequests.ok.count"
#    WHERE $timeFilter GROUP BY time(1s)
