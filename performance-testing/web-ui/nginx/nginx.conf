server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex on;               # 디렉토리 목록 자동 생성
    autoindex_exact_size off;   # 파일 크기를 KB/MB 단위로 표시
    autoindex_localtime on;     # 서버 로컬 시간 표시
    charset utf-8;

    # ── 결과 목록 페이지 ────────────────────────────────────────────────────
    location /results/ {
        alias /usr/share/nginx/html/results/;
        autoindex on;
        add_header Cache-Control "no-cache";
    }

    # ── Gatling HTML 리포트 (simulation.log 제외) ─────────────────────────
    location ~* \.(html|css|js|png|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── 루트 인덱스: 결과 목록으로 리다이렉트 ────────────────────────────
    location = / {
        return 302 /results/;
    }

    # ── 보안: .log, .csv 직접 다운로드 방지 (선택) ────────────────────────
    # location ~* \.(log|csv)$ {
    #     deny all;
    # }

    # ── gzip 압축 ────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1000;
}
