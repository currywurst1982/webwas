# ============================================================
# WildFly 26 JVM 옵션 설정 파일
# 위치: $JBOSS_HOME/bin/standalone.conf (JAVA_OPTS에 추가)
#
# 적용 방법:
#   standalone.conf 에서 JAVA_OPTS 라인을 아래 옵션들로 교체
#   또는 JAVA_OPTS="$JAVA_OPTS <옵션>" 형태로 추가
#
# 서버 스펙별 권장값 (아래에서 환경에 맞게 선택):
#   - 소규모: 8GB RAM, 4 Core
#   - 중규모: 16GB RAM, 8 Core  ← 기본 권장값 기준
#   - 대규모: 32GB RAM, 16 Core
# ============================================================

# ── Heap 크기 ─────────────────────────────────────────────────────────────────
# Xms = Xmx: 동일 설정으로 런타임 Heap 재조정 비용 제거
# 물리 RAM의 50~70% 수준 (OS + Metaspace + Off-heap 여유 필요)
# 16GB 서버: Heap 8~10GB / 32GB 서버: Heap 16~20GB
JAVA_OPTS="-Xms8g -Xmx8g"

# ── GC 설정: G1GC (WildFly 26, Java 11+ 권장) ──────────────────────────────
# G1GC: 응답시간 우선, 대규모 Heap에서 Full GC 최소화
JAVA_OPTS="$JAVA_OPTS -XX:+UseG1GC"

# MaxGCPauseMillis: 목표 GC Pause 시간 (ms)
# API SLA p99 기준으로 설정: 목표 p99가 500ms이면 100~200ms 권장
# 너무 작으면 GC 오버헤드 증가
JAVA_OPTS="$JAVA_OPTS -XX:MaxGCPauseMillis=200"

# G1HeapRegionSize: Region 크기 (1~32MB, 2의 배수)
# Heap / 2048 로 계산: 8GB Heap → 4MB, 16GB Heap → 8MB
JAVA_OPTS="$JAVA_OPTS -XX:G1HeapRegionSize=4m"

# InitiatingHeapOccupancyPercent: Old Gen이 이 % 채워지면 Concurrent GC 시작
# 기본값 45. 낮추면 GC 빈번(CPU 소비↑), 높이면 Full GC 위험↑
JAVA_OPTS="$JAVA_OPTS -XX:InitiatingHeapOccupancyPercent=35"

# G1ReservePercent: 승격 실패 방지용 예약 공간 (기본 10%)
JAVA_OPTS="$JAVA_OPTS -XX:G1ReservePercent=15"

# ConcGCThreads: Concurrent GC 스레드 수 (CPU 코어 / 4 수준)
JAVA_OPTS="$JAVA_OPTS -XX:ConcGCThreads=4"

# ParallelGCThreads: Stop-the-World GC 스레드 수 (CPU 코어 수 이하)
JAVA_OPTS="$JAVA_OPTS -XX:ParallelGCThreads=8"

# ── ZGC 옵션 (Java 15+, 초저지연 응답 필요 시) ──────────────────────────────
# G1GC 대신 ZGC 사용 시 아래로 교체 (p99 10ms 이하 목표 시)
# JAVA_OPTS="-Xms8g -Xmx8g -XX:+UseZGC -XX:SoftMaxHeapSize=7g"

# ── Metaspace 설정 ────────────────────────────────────────────────────────────
# MetaspaceSize: 초기 Metaspace 크기 (재조정 오버헤드 방지)
JAVA_OPTS="$JAVA_OPTS -XX:MetaspaceSize=512m"

# MaxMetaspaceSize: 최대 Metaspace 크기 (기본 무제한 → OOM 방지)
JAVA_OPTS="$JAVA_OPTS -XX:MaxMetaspaceSize=512m"

# ── Code Cache ────────────────────────────────────────────────────────────────
# JIT 컴파일 코드 저장 공간: 256MB 이상 (Code Cache Full → JIT 중단 → 성능 급락)
JAVA_OPTS="$JAVA_OPTS -XX:ReservedCodeCacheSize=256m"

# ── Direct Memory (Undertow 버퍼 등) ─────────────────────────────────────────
JAVA_OPTS="$JAVA_OPTS -XX:MaxDirectMemorySize=1g"

# ── JIT 컴파일러 최적화 ──────────────────────────────────────────────────────
# TieredCompilation: 기본 활성화 (C1 → C2 단계적 컴파일)
JAVA_OPTS="$JAVA_OPTS -XX:+TieredCompilation"

# OptimizeStringConcat: String 연산 최적화
JAVA_OPTS="$JAVA_OPTS -XX:+OptimizeStringConcat"

# ── GC 로그 설정 (성능 분석 필수) ────────────────────────────────────────────
GC_LOG_DIR=/var/log/wildfly/gc
JAVA_OPTS="$JAVA_OPTS \
  -Xlog:gc*,gc+heap=debug,gc+phases=debug:file=${GC_LOG_DIR}/gc_%t_%p.log:time,uptime,level,tags:filecount=5,filesize=100m \
  -Xlog:safepoint:file=${GC_LOG_DIR}/safepoint_%t_%p.log:time,uptime:filecount=3,filesize=50m"

# ── OOM 시 Heap Dump 자동 생성 ────────────────────────────────────────────────
HEAP_DUMP_DIR=/var/log/wildfly/heapdump
JAVA_OPTS="$JAVA_OPTS \
  -XX:+HeapDumpOnOutOfMemoryError \
  -XX:HeapDumpPath=${HEAP_DUMP_DIR}/heapdump_%p.hprof"

# OOM 발생 시 WildFly 자동 재시작 (systemd 환경)
JAVA_OPTS="$JAVA_OPTS -XX:OnOutOfMemoryError='systemctl restart wildfly'"

# ── JMX 원격 모니터링 (성능테스트 중 JConsole/VisualVM 연결용) ──────────────
# 운영 환경에서는 보안 설정 필수 (방화벽 + 인증)
JAVA_OPTS="$JAVA_OPTS \
  -Dcom.sun.management.jmxremote \
  -Dcom.sun.management.jmxremote.port=9091 \
  -Dcom.sun.management.jmxremote.ssl=false \
  -Dcom.sun.management.jmxremote.authenticate=false"

# ── 기타 성능 옵션 ────────────────────────────────────────────────────────────
# 바이어스 락킹: 단일 스레드 반복 락 성능 향상 (Java 15+에서 deprecated)
JAVA_OPTS="$JAVA_OPTS -XX:+UseBiasedLocking"

# Transparent Huge Pages 비활성화 (OS 레벨 THP 활성화된 경우 GC pause 증가 원인)
JAVA_OPTS="$JAVA_OPTS -XX:+AlwaysPreTouch"

# Compressed OOPs: Heap 32GB 미만이면 포인터 압축으로 메모리 절약
JAVA_OPTS="$JAVA_OPTS -XX:+UseCompressedOops"

# NUMAInterleaving: NUMA 아키텍처 서버에서 메모리 분산 할당
# JAVA_OPTS="$JAVA_OPTS -XX:+UseNUMAInterleaving"

# ── 성능테스트 중 추가 모니터링 옵션 (평시에는 제거) ─────────────────────────
# GC 통계 상세 출력:
# JAVA_OPTS="$JAVA_OPTS -verbose:gc"

# JIT 컴파일 로그 (C2 탈최적화 추적):
# JAVA_OPTS="$JAVA_OPTS -XX:+PrintCompilation -XX:+PrintDeoptimization"

# ── 최종 JAVA_OPTS 예시 (standalone.conf 교체용) ──────────────────────────────
# JAVA_OPTS="-server -Xms8g -Xmx8g
#   -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=4m
#   -XX:MetaspaceSize=512m -XX:MaxMetaspaceSize=512m
#   -XX:ReservedCodeCacheSize=256m -XX:MaxDirectMemorySize=1g
#   -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/wildfly/heapdump/
#   -Xlog:gc*:file=/var/log/wildfly/gc/gc_%t.log:time,uptime:filecount=5,filesize=100m
#   -Djava.net.preferIPv4Stack=true
#   -Djboss.modules.system.pkgs=org.jboss.byteman"
